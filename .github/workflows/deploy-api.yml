name: Desplegar API (Cloudflare)

# Solo manual. Requiere en GitHub → Settings → Secrets and variables → Actions:
#   CLOUDFLARE_API_TOKEN  (permisos: Workers Scripts, D1 y R2 de edición)
#   CLOUDFLARE_ACCOUNT_ID
#   D1_DATABASE_ID        (ID devuelto por `wrangler d1 create naturista-valdivia-db`)
# y el entorno "production" (Settings → Environments) con aprobación obligatoria.
on:
  workflow_dispatch:
    inputs:
      apply_migrations:
        description: "Aplicar migraciones de base de datos (se exporta un respaldo antes)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Comprobar configuración
        run: |
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!v}" ]; then echo "::error::Falta el secreto $v"; exit 1; fi
          done
          if [ -z "${{ secrets.D1_DATABASE_ID }}" ]; then echo "::error::Falta el secreto D1_DATABASE_ID"; exit 1; fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Usar el ID real de la base de datos
        run: sed -i 's/00000000-0000-0000-0000-000000000000/${{ secrets.D1_DATABASE_ID }}/' wrangler.toml
      - name: Respaldo de D1 antes de migrar
        if: inputs.apply_migrations
        run: npx wrangler d1 export naturista-valdivia-db --remote --output "d1-backup-$(date -u +%Y%m%dT%H%M%SZ).sql"
      - name: Guardar respaldo
        if: inputs.apply_migrations
        uses: actions/upload-artifact@v4
        with:
          name: d1-backup
          path: worker/d1-backup-*.sql
          retention-days: 30
      - name: Aplicar migraciones
        if: inputs.apply_migrations
        run: npx wrangler d1 migrations apply naturista-valdivia-db --remote
      - name: Desplegar Worker
        run: npx wrangler deploy --var APP_ENV:production

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  worker:
    name: Worker (TypeScript + D1)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build (dry run, sin desplegar)
        run: npx wrangler deploy --dry-run --outdir dist

  migration:
    name: Migración (solo lectura)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: migration
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: migration/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  flutter:
    name: App Flutter
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generar carpetas de plataforma si faltan
        run: |
          if [ ! -d android ] || [ ! -d web ]; then
            flutter create . --platforms=android,web --project-name naturista_valdivia --org cl.naturistavaldivia
            rm -f test/widget_test.dart
          fi
      - name: Aplicar marca web (logo, nombre y colores)
        run: bash branding_web/apply.sh
      - name: Permisos de Android (internet y ubicación)
        run: bash platform_patches/android_permissions.sh
      - name: Android para huella o rostro (local_auth)
        run: bash platform_patches/android_biometric.sh
      - run: flutter pub get
      - run: flutter gen-l10n
      - name: flutter analyze
        run: |
          if ! flutter analyze; then
            # Repite el análisis en formato máquina y publica cada hallazgo como anotación.
            dart analyze --format=machine 2>&1 | awk -F'|' 'NF>=8 {printf "::error file=%s,line=%s,col=%s::%s %s\n", $4, $5, $6, $3, $8}'
            exit 1
          fi
      - name: flutter test
        # También corre si el análisis falló, para ver todos los errores de una vez.
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          if ! flutter test --reporter=expanded 2>&1 | tee test.log; then
            # Publica cada prueba fallida (nombre + detalle) como anotación.
            python3 - <<'PY'
          import os, re
          lines = open('test.log', encoding='utf-8', errors='replace').read().splitlines()
          found = False
          for i, line in enumerate(lines):
              if '[E]' in line:
                  found = True
                  # La excepción se imprime ANTES de la línea [E]: se toman las cabeceras
                  # de cada excepción en las 300 líneas previas con sus 25 líneas siguientes.
                  window = lines[max(0, i - 300):i]
                  parts = []
                  for j, l in enumerate(window):
                      if 'EXCEPTION CAUGHT' in l:
                          parts.extend(window[j:j + 25])
                  if not parts:
                      # Fallos de expect(): el detalle va DESPUÉS de la línea [E].
                      after = [l for l in lines[i + 1:i + 60] if not re.match(r'^\d\d:\d\d \+', l)]
                      parts = after[:40] or window[-40:]
                  detail = '%0A'.join(l.replace('::', ': ').replace('%', '%25') for l in parts[:120])
                  title = line.strip().replace(os.getcwd() + '/', '')[-200:]
                  print(f"::error title={title}::{detail}")
          if not found:
              tail = '%0A'.join(l.replace('::', ': ').replace('%', '%25') for l in lines[-80:])
              print(f"::error title=flutter test (final del registro)::{tail}")
          PY
            exit 1
          fi
      - run: flutter build web --release

  android:
    name: Android (compila con huella y permisos)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generar carpetas de plataforma si faltan
        run: |
          if [ ! -d android ]; then
            flutter create . --platforms=android --project-name naturista_valdivia --org cl.naturistavaldivia
            rm -f test/widget_test.dart
          fi
      - run: bash platform_patches/android_permissions.sh
      - run: bash platform_patches/android_biometric.sh
      - run: flutter pub get
      - run: flutter gen-l10n
      - name: Compilar APK de depuración
        run: flutter build apk --debug
      - name: Comprobar el manifiesto final
        run: |
          grep -q "USE_BIOMETRIC" android/app/src/main/AndroidManifest.xml
          grep -rq "FlutterFragmentActivity" android/app/src/main
          echo "::notice::Android compila con FlutterFragmentActivity y USE_BIOMETRIC."

  security:
    name: Seguridad (dependencias y secretos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm audit (Worker y migración)
        run: |
          (cd worker && npm ci --ignore-scripts && npm audit --audit-level=high)
          (cd migration && npm ci --ignore-scripts && npm audit --audit-level=high)
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Dependencias de Flutter (OSV)
        working-directory: app
        run: |
          flutter pub get
          go install github.com/google/osv-scanner/v2/cmd/osv-scanner@latest
          "$(go env GOPATH)/bin/osv-scanner" scan source --lockfile=pubspec.lock
      - name: Buscar secretos en el repositorio
        run: |
          # Claves privadas, cuentas de servicio y tokens no deben estar en Git (repositorio público).
          if git grep -nIE -- '-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|"type": *"service_account"|"private_key_id"|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36}|xox[baprs]-[A-Za-z0-9-]{10,}' -- . ':!*.md' ':!.github/workflows/*'; then
            echo "::error::Posible secreto en el repositorio (ver líneas arriba)."; exit 1
          fi
          echo "::notice::Sin secretos detectados en archivos versionados."

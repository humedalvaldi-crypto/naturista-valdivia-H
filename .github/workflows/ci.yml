name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  worker:
    name: Worker (TypeScript + D1)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build (dry run, sin desplegar)
        run: npx wrangler deploy --dry-run --outdir dist

  migration:
    name: Migración (solo lectura)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: migration
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: migration/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  flutter:
    name: App Flutter
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generar carpetas de plataforma si faltan
        run: |
          if [ ! -d android ] || [ ! -d web ]; then
            flutter create . --platforms=android,web --project-name naturista_valdivia --org cl.naturistavaldivia
            rm -f test/widget_test.dart
          fi
      - run: flutter pub get
      - run: flutter gen-l10n
      - name: flutter analyze
        run: |
          if ! flutter analyze; then
            # Repite el análisis en formato máquina y publica cada hallazgo como anotación.
            dart analyze --format=machine 2>&1 | awk -F'|' 'NF>=8 {printf "::error file=%s,line=%s,col=%s::%s %s\n", $4, $5, $6, $3, $8}'
            exit 1
          fi
      - run: flutter test --reporter=github
      - run: flutter build web --release

name: Migrar datos desde Firebase (copia)

# Copia los datos de la app antigua (Firebase) a la app nueva (Cloudflare D1).
# Firebase NO se modifica: la app antigua sigue funcionando. Se puede repetir
# más adelante para traer lo nuevo: no duplica nada.
#
# Requiere el secreto FIREBASE_SERVICE_ACCOUNT (JSON de una cuenta de servicio
# de SOLO LECTURA) además de CLOUDFLARE_API_TOKEN y CLOUDFLARE_ACCOUNT_ID.
# Ver docs/migration-plan.md, sección "Cómo migrar desde GitHub".
#
# Modos:
#   ensayo  → lee Firebase y genera el informe; no escribe nada.
#   migrar  → además copia fotos y datos a D1 (hay que escribir MIGRAR).
# El repositorio es público: solo se suben informes con conteos y nombres de
# campos; nunca la instantánea ni datos personales.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "ensayo (no escribe) o migrar (escribe en la app nueva)"
        type: choice
        options: [ensayo, migrar]
        default: ensayo
      confirm:
        description: "Para el modo migrar, escribe MIGRAR"
        type: string
        default: ""
  # También con un archivo de solicitud (solo quien puede escribir en el repositorio):
  # migration/run-request.json → {"mode": "ensayo"} o {"mode": "migrar", "confirm": "MIGRAR"}
  push:
    branches: [main]
    paths: ["migration/run-request.json"]

permissions:
  contents: read

concurrency:
  group: migrate-firebase
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 120
    env:
      PROJECT: humedalvaldivia-c7d08
      DB_NAME: naturista-valdivia-db
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Modo pedido
        env:
          IN_MODE: ${{ inputs.mode }}
          IN_CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            MODE=$(python3 -c "import json;print(json.load(open('migration/run-request.json')).get('mode','ensayo'))")
            CONFIRM=$(python3 -c "import json;print(json.load(open('migration/run-request.json')).get('confirm',''))")
          else
            MODE="$IN_MODE"; CONFIRM="$IN_CONFIRM"
          fi
          case "$MODE" in ensayo|migrar) ;; *) echo "::error::Modo no válido: $MODE"; exit 1;; esac
          echo "MODE=$MODE" >> "$GITHUB_ENV"
          echo "CONFIRM=$CONFIRM" >> "$GITHUB_ENV"
          echo "::notice::Modo: $MODE"
      - name: Comprobar configuración
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          [ -n "$SA" ] || { echo "::error::Falta el secreto FIREBASE_SERVICE_ACCOUNT (ver docs/migration-plan.md)."; exit 1; }
          echo "$SA" | python3 -c "import sys,json;d=json.load(sys.stdin);assert d.get('type')=='service_account' and d.get('project_id')=='$PROJECT'" \
            || { echo "::error::FIREBASE_SERVICE_ACCOUNT no es una cuenta de servicio JSON del proyecto $PROJECT."; exit 1; }
          if [ "$MODE" = "migrar" ]; then
            [ "$CONFIRM" = "MIGRAR" ] || { echo "::error::Para migrar escribe MIGRAR en la confirmación."; exit 1; }
            [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "::error::Faltan los secretos de Cloudflare."; exit 1; }
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar
        run: |
          (cd migration && npm ci)
          (cd worker && npm ci)
      - name: Pruebas de la migración
        run: cd migration && npm test

      - name: Credencial de lectura (solo en este equipo temporal)
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          umask 077
          OUT="$RUNNER_TEMP/migracion"
          mkdir -p "$OUT"
          echo "OUT=$OUT" >> "$GITHUB_ENV"
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      - name: 1. Auditoría (solo lectura)
        working-directory: migration
        run: bash scripts/ci-run.sh npm run audit -- --project "$PROJECT" --out "$OUT/audit"
      - name: 2. Exportar (solo lectura)
        working-directory: migration
        run: bash scripts/ci-run.sh npm run export -- --project "$PROJECT" --out "$OUT"
      - name: 3. Plan e informe
        working-directory: migration
        run: |
          SNAP=$(ls -d "$OUT"/snapshot-* | head -1)
          bash scripts/ci-run.sh npm run plan -- --snapshot "$SNAP" --out "$OUT/plan"
      - name: 4. Fotos (ensayo o copia a D1)
        working-directory: migration
        run: |
          if [ "$MODE" = "migrar" ]; then
            bash scripts/ci-run.sh npm run copy-media -- --plan "$OUT/plan" --project "$PROJECT" --store d1 --confirm
          else
            bash scripts/ci-run.sh npm run copy-media -- --plan "$OUT/plan" --project "$PROJECT"
          fi

      - name: Base D1 de producción
        if: env.MODE == 'migrar'
        working-directory: worker
        run: |
          ID=$(npx wrangler d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const l=JSON.parse(s.slice(s.indexOf("[")));const d=l.find(x=>x.name===process.argv[1]);process.stdout.write(d?(d.uuid||d.id||""):"")})' "$DB_NAME")
          [ -n "$ID" ] || { echo "::error::No existe la base $DB_NAME: despliega primero la API."; exit 1; }
          sed -i "s/00000000-0000-0000-0000-000000000000/$ID/" wrangler.toml
          npx wrangler d1 migrations apply "$DB_NAME" --remote
          echo "Punto de restauración antes de migrar:"
          npx wrangler d1 time-travel info "$DB_NAME"
      - name: 5. Copiar datos a la app nueva
        if: env.MODE == 'migrar'
        working-directory: migration
        run: bash scripts/ci-run.sh npm run apply -- --plan "$OUT/plan" --remote --mode production --confirm "$DB_NAME" --skip-backup
      - name: 6. Validar
        if: env.MODE == 'migrar'
        working-directory: migration
        run: bash scripts/ci-run.sh npm run validate -- --plan "$OUT/plan" --remote

      - name: Resumen
        if: always()
        run: |
          {
            echo "## Migración desde Firebase — modo $MODE"
            if [ -f "$OUT/plan/report.md" ]; then sed -n '1,80p' "$OUT/plan/report.md"; fi
            if ls "$OUT"/plan/media-report-*.json >/dev/null 2>&1; then echo; echo '### Fotos'; echo '```'; cat "$OUT"/plan/media-report-*.json; echo '```'; fi
            if [ -f "$OUT/plan/validation-remote.md" ]; then echo; echo '### Validación'; cat "$OUT/plan/validation-remote.md"; fi
          } >> "$GITHUB_STEP_SUMMARY" || true
      - name: Informes (sin datos personales)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-migracion-${{ env.MODE }}
          retention-days: 30
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/migracion/audit/*.md
            ${{ runner.temp }}/migracion/plan/report.md
            ${{ runner.temp }}/migracion/plan/report.json
            ${{ runner.temp }}/migracion/plan/media-report-*.json
            ${{ runner.temp }}/migracion/plan/validation-*.md
      - name: Borrar la credencial y la instantánea
        if: always()
        run: rm -rf "$RUNNER_TEMP/sa.json" "$OUT"

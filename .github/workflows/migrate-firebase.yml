name: Migrar datos desde Firebase (copia)

# Copia los datos de la app antigua (Firebase) a la app nueva (Cloudflare D1).
# Firebase NO se modifica: la app antigua sigue funcionando. Se puede repetir
# más adelante para traer lo nuevo: no duplica nada.
#
# Requiere el secreto FIREBASE_SERVICE_ACCOUNT (JSON de una cuenta de servicio
# de SOLO LECTURA) además de CLOUDFLARE_API_TOKEN y CLOUDFLARE_ACCOUNT_ID.
# Ver docs/migration-plan.md, sección "Cómo migrar desde GitHub".
#
# Modos:
#   ensayo  → lee Firebase y genera el informe; no escribe nada.
#   migrar  → además copia fotos y datos a D1 (hay que escribir MIGRAR).
# El repositorio es público: solo se suben informes con conteos y nombres de
# campos; nunca la instantánea ni datos personales.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "ensayo (no escribe) o migrar (escribe en la app nueva)"
        type: choice
        options: [ensayo, migrar]
        default: ensayo
      confirm:
        description: "Para el modo migrar, escribe MIGRAR"
        type: string
        default: ""
  # También con un archivo de solicitud (solo quien puede escribir en el repositorio):
  # migration/run-request.json → {"mode": "ensayo"} o {"mode": "migrar", "confirm": "MIGRAR"}
  push:
    branches: [main]
    paths: ["migration/run-request.json"]

permissions:
  contents: read

concurrency:
  group: migrate-firebase
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 120
    env:
      PROJECT: humedalvaldivia-c7d08
      DB_NAME: naturista-valdivia-db
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Modo pedido
        env:
          IN_MODE: ${{ inputs.mode }}
          IN_CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            MODE=$(python3 -c "import json;print(json.load(open('migration/run-request.json')).get('mode','ensayo'))")
            CONFIRM=$(python3 -c "import json;print(json.load(open('migration/run-request.json')).get('confirm',''))")
          else
            MODE="$IN_MODE"; CONFIRM="$IN_CONFIRM"
          fi
          case "$MODE" in ensayo|migrar) ;; *) echo "::error::Modo no válido: $MODE"; exit 1;; esac
          echo "MODE=$MODE" >> "$GITHUB_ENV"
          echo "CONFIRM=$CONFIRM" >> "$GITHUB_ENV"
          echo "::notice::Modo: $MODE"
      - name: Comprobar configuración
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          [ -n "$SA" ] || { echo "::error::Falta el secreto FIREBASE_SERVICE_ACCOUNT (ver docs/migration-plan.md)."; exit 1; }
          # Diagnóstico sin revelar la clave: forma del JSON y validez de la clave privada.
          printf '%s' "$SA" | python3 -c '
          import json, subprocess, sys, tempfile
          import base64, os
          raw = sys.stdin.read()
          t = raw.strip().lstrip("\ufeff").strip()
          if len(t) >= 2 and t[0] == t[-1] and t[0] in "\"\x27`":
              t = t[1:-1].strip()  # comillas de más alrededor
          if t and not t.startswith("{"):
              try:  # quizás en base64
                  dec = base64.b64decode(t, validate=False).decode("utf-8")
                  if dec.strip().startswith("{"):
                      t = dec.strip()
              except Exception:
                  pass
          try:
              d = json.loads(t)
          except json.JSONDecodeError as e:
              kind = lambda c: "llave {" if c == "{" else "llave }" if c == "}" else "comilla" if c in "\"\x27" else "letra" if c.isalpha() else "número" if c.isdigit() else "otro símbolo"
              msg = (f"FIREBASE_SERVICE_ACCOUNT no es JSON válido. Largo: {len(t)} caracteres (un archivo correcto tiene unos 2300). "
                     + (f"Empieza con: {kind(t[0])}. Termina con: {kind(t[-1])}. Se rompe al {round(100*e.pos/max(len(t),1))}% del contenido ({e.msg}). " if t else "Está vacío. ")
                     + "Pega el archivo .json completo, desde la primera llave { hasta la última }.")
              print("::error::" + msg); sys.exit(1)
          with open(os.environ["GITHUB_ENV"], "a") as envf:
              pass
          if d.get("type") != "service_account" or d.get("project_id") != sys.argv[1]:
              print("::error::La credencial no es una cuenta de servicio del proyecto " + sys.argv[1] + "."); sys.exit(1)
          key = d.get("private_key", "")
          if not key.startswith("-----BEGIN PRIVATE KEY-----") or "\n" not in key:
              print("::error::La clave privada del JSON está alterada (faltan saltos de línea o el encabezado). Vuelve a copiar el archivo completo."); sys.exit(1)
          with tempfile.NamedTemporaryFile("w", suffix=".pem", delete=True) as f:
              f.write(key); f.flush()
              ok = subprocess.run(["openssl", "pkey", "-in", f.name, "-noout"], capture_output=True).returncode == 0
          if not ok:
              print("::error::La clave privada del JSON está dañada. Crea una clave nueva y pega el archivo completo."); sys.exit(1)
          print("::notice::Credencial con formato correcto. Cuenta: " + d.get("client_email", "?").split("@")[0] + " · ID de clave empieza con: " + d.get("private_key_id", "")[:8])
          ' "$PROJECT"
          if [ "$MODE" = "migrar" ]; then
            [ "$CONFIRM" = "MIGRAR" ] || { echo "::error::Para migrar escribe MIGRAR en la confirmación."; exit 1; }
            [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "::error::Faltan los secretos de Cloudflare."; exit 1; }
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar
        run: |
          (cd migration && npm ci)
          (cd worker && npm ci)
      - name: Pruebas de la migración
        run: cd migration && npm test

      - name: Credencial de lectura (solo en este equipo temporal)
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          umask 077
          OUT="$RUNNER_TEMP/migracion"
          mkdir -p "$OUT"
          echo "OUT=$OUT" >> "$GITHUB_ENV"
          printf '%s' "$SA" | python3 -c '
          import base64, json, sys
          t = sys.stdin.read().strip().lstrip("\ufeff").strip()
          if len(t) >= 2 and t[0] == t[-1] and t[0] in "\"\x27`": t = t[1:-1].strip()
          if not t.startswith("{"): t = base64.b64decode(t).decode("utf-8").strip()
          json.dump(json.loads(t), sys.stdout)
          ' > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      - name: 1. Auditoría (solo lectura)
        working-directory: migration
        run: bash scripts/ci-run.sh npm run audit -- --project "$PROJECT" --out "$OUT/audit"
      - name: 2. Exportar (solo lectura)
        working-directory: migration
        run: bash scripts/ci-run.sh npm run export -- --project "$PROJECT" --out "$OUT"
      - name: 3. Plan e informe
        working-directory: migration
        run: |
          SNAP=$(ls -d "$OUT"/snapshot-* | head -1)
          bash scripts/ci-run.sh npm run plan -- --snapshot "$SNAP" --out "$OUT/plan"
      - name: Resumen del plan (solo conteos)
        run: |
          python3 - "$OUT/plan/report.json" <<'PY'
          import json, sys
          r = json.load(open(sys.argv[1]))
          rows = ", ".join(f"{t}: {n}" for t, n in sorted(r["expected"].items()))
          hosts = ", ".join(f"{h} ({n})" for h, n in r["media"]["externalHosts"].items())
          lines = [f"Filas a crear → {rows}", f"Fotos: {r['media']['total']} ({r['media']['inline']} incrustadas, {r['media']['fromStorage']} de Storage o servidores externos)", f"Fotos en otros servidores (dominio): {hosts or 'ninguna'}"]
          for name, c in r["collections"].items():
              skipped = "; ".join(f"{k} ({v})" for k, v in c["skipped"].items())
              personal = ", ".join(f"{k} ({v})" for k, v in c["excludedPersonalFields"].items())
              unmapped = ", ".join(f"{k} ({v})" for k, v in sorted(c["unmappedFields"].items(), key=lambda x: -x[1])[:15])
              line = f"[{name}] leídos {c['read']}"
              if skipped: line += f" · omitidos: {skipped}"
              if personal: line += f" · datos personales no copiados: {personal}"
              if unmapped: line += f" · campos sin mapear: {unmapped}"
              lines.append(line)
              for field, shapes in c.get("unmappedShapes", {}).items():
                  lines.append(f"    forma de {name}.{field}: " + " || ".join(shapes))
          print("::notice title=Plan de migración::" + "%0A".join(l.replace("%", "%25") for l in lines))
          PY
      - name: 4. Fotos (ensayo o copia a D1)
        working-directory: migration
        run: |
          if [ "$MODE" = "migrar" ]; then
            bash scripts/ci-run.sh npm run copy-media -- --plan "$OUT/plan" --project "$PROJECT" --store d1 --confirm
          else
            bash scripts/ci-run.sh npm run copy-media -- --plan "$OUT/plan" --project "$PROJECT"
          fi

      - name: Resultado de las fotos
        run: |
          for f in "$OUT"/plan/media-report-*.json; do
            [ -f "$f" ] && python3 -c "import json,sys;r=json.load(open(sys.argv[1]));print('::notice title=Fotos::válidas %s de %s · copiadas %s · problemas: %s' % (r['valid'], r['planned'], r['copiedTotal'], ', '.join(f'{k} ({v})' for k,v in r['failures'].items()) or 'ninguno'))" "$f"
          done
      - name: Base D1 de producción
        if: env.MODE == 'migrar'
        working-directory: worker
        run: |
          ID=$(npx wrangler d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const l=JSON.parse(s.slice(s.indexOf("[")));const d=l.find(x=>x.name===process.argv[1]);process.stdout.write(d?(d.uuid||d.id||""):"")})' "$DB_NAME")
          [ -n "$ID" ] || { echo "::error::No existe la base $DB_NAME: despliega primero la API."; exit 1; }
          sed -i "s/00000000-0000-0000-0000-000000000000/$ID/" wrangler.toml
          npx wrangler d1 migrations apply "$DB_NAME" --remote
          echo "Punto de restauración antes de migrar:"
          npx wrangler d1 time-travel info "$DB_NAME"
      - name: 5. Copiar datos a la app nueva
        if: env.MODE == 'migrar'
        working-directory: migration
        run: bash scripts/ci-run.sh npm run apply -- --plan "$OUT/plan" --remote --mode production --confirm "$DB_NAME" --skip-backup
      - name: 6. Validar
        if: env.MODE == 'migrar'
        working-directory: migration
        run: bash scripts/ci-run.sh npm run validate -- --plan "$OUT/plan" --remote

      - name: Resumen
        if: always()
        run: |
          {
            echo "## Migración desde Firebase — modo $MODE"
            if [ -f "$OUT/plan/report.md" ]; then sed -n '1,80p' "$OUT/plan/report.md"; fi
            if ls "$OUT"/plan/media-report-*.json >/dev/null 2>&1; then echo; echo '### Fotos'; echo '```'; cat "$OUT"/plan/media-report-*.json; echo '```'; fi
            if [ -f "$OUT/plan/validation-remote.md" ]; then echo; echo '### Validación'; cat "$OUT/plan/validation-remote.md"; fi
          } >> "$GITHUB_STEP_SUMMARY" || true
      - name: Informes (sin datos personales)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-migracion-${{ env.MODE }}
          retention-days: 30
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/migracion/audit/*.md
            ${{ runner.temp }}/migracion/plan/report.md
            ${{ runner.temp }}/migracion/plan/report.json
            ${{ runner.temp }}/migracion/plan/media-report-*.json
            ${{ runner.temp }}/migracion/plan/validation-*.md
      - name: Borrar la credencial y la instantánea
        if: always()
        run: rm -rf "$RUNNER_TEMP/sa.json" "$OUT"

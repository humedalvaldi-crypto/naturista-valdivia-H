name: Publicar app web (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generar carpetas de plataforma si faltan
        run: |
          if [ ! -d android ] || [ ! -d web ]; then
            flutter create . --platforms=android,web --project-name naturista_valdivia --org cl.naturistavaldivia
            rm -f test/widget_test.dart
          fi
      - name: Aplicar marca web (logo, nombre y colores)
        run: bash branding_web/apply.sh
      - run: flutter pub get
      - run: flutter test
      - name: Compilar web
        # API_BASE_URL: variable del repositorio o, si está vacía, la URL que
        # guardó el despliegue automático de la API (deploy/api-url.txt).
        run: |
          API="${{ vars.API_BASE_URL }}"
          if [ -z "$API" ] && [ -f ../deploy/api-url.txt ]; then API=$(head -1 ../deploy/api-url.txt | tr -d '[:space:]'); fi
          echo "API_BASE_URL=${API:-(sin servidor)}"
          flutter build web --release --base-href "/${{ github.event.repository.name }}/" --dart-define=API_BASE_URL=$API
      - name: Agregar páginas públicas (privacidad y eliminación de cuenta, enlazadas desde Google Play)
        run: cp store/privacidad.html store/eliminar-cuenta.html build/web/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

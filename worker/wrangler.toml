# Naturista Valdivia — API (Cloudflare Worker)
# Funciona en el plan GRATUITO de Cloudflare, sin tarjeta: Workers + D1.
# El despliegue automático (.github/workflows/deploy-api.yml) crea la base D1,
# completa su ID y, solo si la cuenta tiene R2 activado, usa R2 para archivos.
# No hay secretos en este archivo.
name = "naturista-valdivia-api"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[vars]
APP_ENV = "development"
FIREBASE_PROJECT_ID = "humedalvaldivia-c7d08"
ALLOWED_ORIGINS = "https://humedalvaldi-crypto.github.io,http://localhost:8080,http://localhost:5173"

[[d1_databases]]
binding = "DB"
database_name = "naturista-valdivia-db"
# Reemplazar por el ID devuelto por `wrangler d1 create naturista-valdivia-db`.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# R2 es OPCIONAL (Cloudflare pide registrar un medio de pago para activarlo).
# Sin R2 los archivos se guardan en D1 (tabla media_chunks). El despliegue
# automático añade este bloque si detecta R2 activado en la cuenta:
# [[r2_buckets]]
# binding = "MEDIA"
# bucket_name = "naturista-valdivia-media"

[observability]
enabled = true

# Límites de frecuencia (Cloudflare Rate Limiting). period admite 10 o 60 s.
[[ratelimits]]
name = "RL_WRITE"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "RL_UPLOAD"
namespace_id = "1002"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "RL_PUBLIC"
namespace_id = "1003"
simple = { limit = 300, period = 60 }

# Limpieza diaria de archivos borrados y huérfanos (04:15 UTC).
[triggers]
crons = ["15 4 * * *"]

# MEDIA_SIGNING_KEY es un secreto: `npx wrangler secret put MEDIA_SIGNING_KEY`

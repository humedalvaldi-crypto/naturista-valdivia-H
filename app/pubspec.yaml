name: naturista_valdivia
description: "Naturista Valdivia — biodiversidad, cuadernos de campo y comunidad naturalista de Valdivia."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  go_router: ^16.0.0
  shared_preferences: ^2.5.3
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  http: ^1.4.0
  image_picker: ^1.1.2
  flutter_map: ^8.3.0
  latlong2: ^0.9.1
  geolocator: ^14.0.2
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/illustrations/aves/
    - assets/illustrations/flora/
    - assets/illustrations/funga/
    - assets/illustrations/mamiferos/
    - assets/illustrations/insectos/
    - assets/illustrations/ecosistemas/
    - assets/illustrations/desafios/
    - assets/history/
    - assets/stickers/
    - assets/branding/
